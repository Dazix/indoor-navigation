<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1000" height="1000">
  <!-- Sample office floor plan. Coordinates match default-map.json (0–100 on both axes). -->
  <rect x="0" y="0" width="100" height="100" fill="#f8fafc"/>

  <!-- Corridors -->
  <g fill="#e2e8f0">
    <rect x="44" y="30" width="12" height="44"/>
    <rect x="30" y="45" width="40" height="10"/>
    <rect x="28" y="16" width="44" height="10"/>
    <rect x="44" y="88" width="12" height="12"/>
  </g>

  <!-- Outer walls -->
  <rect x="3" y="6" width="94" height="90" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Room walls -->
  <g fill="none" stroke="#475569" stroke-width="0.7">
    <rect x="6" y="10" width="24" height="24"/>
    <rect x="32" y="10" width="36" height="25"/>
    <rect x="70" y="10" width="24" height="24"/>
    <rect x="6" y="38" width="28" height="24"/>
    <rect x="66" y="38" width="28" height="24"/>
    <rect x="30" y="70" width="40" height="22"/>
  </g>

  <!-- Door openings -->
  <g stroke="#f8fafc" stroke-width="1.2">
    <line x1="30" y1="19" x2="30" y2="25"/>
    <line x1="70" y1="19" x2="70" y2="25"/>
    <line x1="47" y1="35" x2="53" y2="35"/>
    <line x1="34" y1="47" x2="34" y2="53"/>
    <line x1="66" y1="47" x2="66" y2="53"/>
    <line x1="47" y1="70" x2="53" y2="70"/>
    <line x1="47" y1="92" x2="53" y2="92"/>
    <line x1="46" y1="96" x2="54" y2="96"/>
  </g>

  <!-- Furniture hints -->
  <g fill="#cbd5e1">
    <rect x="36" y="14" width="10" height="4" rx="0.8"/>
    <rect x="54" y="14" width="10" height="4" rx="0.8"/>
    <rect x="36" y="27" width="10" height="4" rx="0.8"/>
    <rect x="54" y="27" width="10" height="4" rx="0.8"/>
    <rect x="72" y="44" width="16" height="12" rx="3"/>
    <rect x="8" y="40" width="4" height="20" rx="0.8"/>
    <rect x="40" y="80" width="20" height="4" rx="2"/>
  </g>
</svg>
